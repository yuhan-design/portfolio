
name: Deploy static content to Pages

on:
  # 當你推送到 main 分支時觸發自動部署
  push:
    branches: ["main"]

  # 允許你在 GitHub 網頁上手動點擊觸發部署
  workflow_dispatch:

# 設定權限，允許此工作流程修改 GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# 避免重複執行時起衝突，只保留最新的一次執行
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps: deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # 這裡設定要上傳的資料夾位置，"." 代表專案根目錄
          # 如果你的 index.html 在根目錄，這樣寫就對了
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4